<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06161b">
  <title>Money Maze · Ask a question</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; }
    .hero { margin-bottom: 22px; }
    .hero .logo { font-size: clamp(40px, 12.5vw, 64px); margin: 12px 0 14px; }
    .hero .talk { font-size: 20px; font-weight: 700; margin: 0 0 6px; color: var(--cream); line-height: 1.3; }
    .hero p { margin: 0; }

    .card { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 17px; color: var(--cream); margin: 16px 0 8px; }
    label:first-child { margin-top: 0; }
    input, select, textarea {
      width: 100%; font: inherit; font-size: 16px; color: var(--ink);
      background: var(--bg-2); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px;
      appearance: none; -webkit-appearance: none;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%;
      background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px;
    }
    textarea { resize: vertical; min-height: 120px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(46, 229, 157, 0.2); }
    ::placeholder { color: #5f8a85; }

    .form-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .counter { font-size: 10px; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font: inherit; font-weight: 700; font-size: 18px; color: #06161b; text-decoration: none;
      background: var(--green); border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer;
      box-shadow: 0 5px 0 #17996a; transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #17996a; }
    .btn:disabled { opacity: 0.6; }
    .btn.ghost { background: transparent; color: var(--cream); border: 2px solid var(--green); box-shadow: none; width: 100%; }
    .error { color: var(--red); font-weight: 600; margin: 12px 0 0; min-height: 1em; }

    .score { padding: 16px 20px; }
    .score-line { font-size: 12px; line-height: 1.8; color: var(--gold); display: flex; align-items: center; gap: 10px; }
    .coin { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); box-shadow: inset -3px -3px 0 #d99a1e; flex: none; }
    .myqs { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
    .myqs li { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
    .myqs p { margin: 0; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
    .chip { font-family: var(--font-pixel); font-size: 8px; letter-spacing: 0.1em; padding: 7px 9px; border-radius: 999px; white-space: nowrap; background: var(--panel-2); color: var(--muted); }
    .chip.onscreen { background: var(--gold); color: #06161b; animation: pulse 1.2s infinite; }
    .chip.answered { background: rgba(46, 229, 157, 0.15); color: var(--green); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 201, 74, 0.25); } }

    .badge { border-color: var(--pink); text-align: center; }
    .badge .eyebrow { color: var(--pink); line-height: 1.8; }
    .badge img { width: 100%; max-width: 340px; display: block; margin: 16px auto; }
    .badge p { margin: 12px 0 0; }

    .follow { display: flex; align-items: center; justify-content: space-between; background: var(--cream); color: var(--cream-ink); border: 0; text-decoration: none; font-size: 17px; }
    .follow span { font-size: 24px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold); color: #06161b; font-weight: 700; padding: 12px 20px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    .save-overlay { position: fixed; inset: 0; z-index: 10; background: rgba(6, 22, 27, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; }
    .save-overlay p { margin: 0; font-size: 18px; color: var(--cream); }
    .save-overlay img { max-width: 100%; max-height: 65vh; -webkit-touch-callout: default; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="eyebrow" id="eventName"></div>
      <h1 class="logo" id="gameTitle">MONEY MAZE</h1>
      <p class="talk" id="talkTitle"></p>
      <p class="muted" id="speaker"></p>
    </header>

    <section class="card score" id="scoreCard" hidden>
      <div class="pixel score-line"><span class="coin"></span><span><span id="myPts">0</span> PTS · <span id="myCount">0</span> <span id="qWord">QUESTIONS</span></span></div>
      <ul class="myqs" id="myQs"></ul>
    </section>

    <form class="card" id="askForm" novalidate>
      <label for="name">Your name</label>
      <input id="name" maxlength="24" autocomplete="given-name" placeholder="First name" required>

      <label for="role">You are…</label>
      <select id="role"><option value="">Choose one</option></select>

      <label for="q" id="qLabel">Share a Question or Feedback</label>
      <textarea id="q" rows="5" placeholder="Have a question, a helpful AI tip, or suggestion for my presentation? Your insights can help me grow!" required></textarea>

      <div class="form-foot">
        <span class="pixel counter" id="counter">0/280</span>
        <button class="btn" type="submit" id="send">Send</button>
      </div>
      <p class="error" id="err" role="alert"></p>
    </form>

    <section class="card badge" id="badgeCard" hidden>
      <div class="eyebrow">Badge unlocked</div>
      <img id="badgeImg" alt="Your Money Maze badge">
      <button class="btn ghost" type="button" id="download">Download badge</button>
    </section>

    <div class="save-overlay" id="saveOverlay" hidden>
      <p><b>Press and hold the badge</b>, then tap <b>Save to Photos</b>.</p>
      <img id="saveImg" alt="Your badge">
      <button class="btn" type="button" id="saveClose">Done</button>
    </div>

    <a class="card follow" id="follow" target="_blank" rel="noopener" hidden>
      <b>Follow <span id="followName"></span> on LinkedIn</b><span>→</span>
    </a>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/sprites.js"></script>
  <script src="/audience.js"></script>
</body>
</html>
