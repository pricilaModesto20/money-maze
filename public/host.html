<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Money Maze · Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 20px; }
    header .logo { font-size: 44px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .links a, button {
      font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; cursor: pointer;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    }
    button:hover, .links a:hover { border-color: var(--green); }
    button.primary { background: var(--gold); color: #06161b; border-color: var(--gold); }
    button.danger { color: var(--red); }

    .grid { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
    h2 { font-family: var(--font-pixel); font-size: 11px; letter-spacing: 0.14em; color: var(--green); margin: 0 0 12px; font-weight: 400; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    .now { border-color: var(--gold); margin-bottom: 18px; }
    .now p { font-size: 22px; font-weight: 700; margin: 0 0 10px; color: var(--cream); }

    .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .filters button.on { border-color: var(--green); color: var(--green); }
    .qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .q { background: var(--bg-2); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .q.onscreen { border-color: var(--gold); }
    .q.answered { opacity: 0.55; }
    .q.hidden { opacity: 0.4; }
    .q p { margin: 0 0 8px; font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .meta b { color: var(--ink); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .actions button { font-size: 13px; padding: 6px 10px; }
    .empty { color: var(--muted); }

    .players { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .players li { display: grid; grid-template-columns: 12px 1fr auto auto auto; align-items: center; gap: 8px; font-size: 14px; }
    .players .sw { width: 12px; height: 12px; border-radius: 3px; }
    .players .pts { font-family: var(--font-pixel); font-size: 9px; color: var(--gold); }
    .players button { padding: 3px 7px; font-size: 12px; }
    .login { max-width: 360px; margin: 15vh auto; text-align: center; }
    .login input { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg-2); color: var(--ink); margin: 12px 0; }
    .err { color: var(--red); }
  </style>
</head>
<body>
  <form class="card login" id="login" hidden>
    <h2>Host key</h2>
    <p class="muted small">Printed in the terminal when the server starts.</p>
    <input id="keyInput" autocomplete="off" placeholder="Host key">
    <button class="primary" type="submit">Enter</button>
    <p class="err" id="loginErr"></p>
  </form>

  <div class="wrap" id="app" hidden>
    <header>
      <div>
        <div class="eyebrow">Host panel</div>
        <h1 class="logo">MONEY MAZE</h1>
      </div>
      <div class="links">
        <a href="/screen" target="_blank">Open projector screen ↗</a>
        <a id="audLink" target="_blank">Audience page ↗</a>
      </div>
    </header>

    <div class="card now" id="nowCard">
      <h2><span>On screen now</span><button id="clearBtn">Clear screen</button></h2>
      <p id="nowText"></p>
      <div class="meta" id="nowMeta"></div>
    </div>

    <div class="grid">
      <section class="card">
        <h2><span>Questions <span id="qCount"></span></span></h2>
        <div class="filters" id="filters">
          <button data-f="open" class="on">To answer</button>
          <button data-f="answered">Answered</button>
          <button data-f="all">All</button>
        </div>
        <ul class="qs" id="qs"></ul>
      </section>

      <aside class="card">
        <h2><span>Players <span id="pCount"></span></span></h2>
        <ul class="players" id="players"></ul>
        <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
        <button class="danger" id="resetBtn">Reset everything</button>
      </aside>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
